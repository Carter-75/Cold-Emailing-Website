name: Phoenix Outreach Engine (30m Pacing)

on:
  schedule:
    # Runs every 30 minutes from 13:00 to 23:30 UTC (8:00am - 6:30pm CDT), Mon-Fri
    - cron: '*/30 13-23 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  outreach:
    runs-on: ubuntu-latest
    env:
      PROD_URL: ${{ secrets.PROD_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Deep Sync Sweep
        run: |
          if [ -z "$PROD_URL" ]; then echo "Error: PROD_URL secret is missing"; exit 1; fi
          echo "Starting Deep Sync Iteration..."
          while true; do
            RESPONSE=$(curl -s "$PROD_URL/api/cron/deep-sync" -H "Authorization: Bearer $CRON_SECRET")
            DONE=$(echo $RESPONSE | jq -r '.result.done')
            if [ "$DONE" = "true" ] || [ "$DONE" = "null" ]; then
              echo "Deep Sync completed or none queued."
              break
            fi
            echo "Chunk processed, fetching next chunk in 2s..."
            sleep 2
          done

      - name: Trigger Outreach Chunk
        run: |
          if [ -z "$PROD_URL" ]; then echo "Error: PROD_URL secret is missing"; exit 1; fi
          curl -X GET "$PROD_URL/api/cron/outreach" \
               -H "Authorization: Bearer $CRON_SECRET" \
               -v

      - name: Trigger Maintenance Sweep
        run: |
          if [ -z "$PROD_URL" ]; then echo "Error: PROD_URL secret is missing"; exit 1; fi
          curl -X GET "$PROD_URL/api/cron/maintenance" \
               -H "Authorization: Bearer $CRON_SECRET" \
               -v
